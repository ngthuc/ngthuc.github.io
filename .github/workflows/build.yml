name: Build and deploy homepage to gh-pages

on:
  push:
    branches:
      - master

jobs:
  react-deploy-gh-pages:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
      with:
        node-version: 18

    - run: npm install --legacy-peer-deps && npm run deploy